name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361" # master

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Run HACS validation"
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa" # main
        with:
          category: "integration"

  dependabot-config:
    name: "Dependabot config"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Install PyYAML"
        run: python3 -m pip install pyyaml

      - name: "Lint .github/dependabot.yml"
        # Guards against the failure modes that silently broke this file:
        # duplicate top-level keys (non-idempotent bootstrap append), an
        # ecosystem directory with no manifest (npm at "/" when it lives in
        # /js), and phantom ecosystems. A plain yaml parse does NOT catch these.
        run: python3 scripts/lint-dependabot

  release-guards:
    name: "Release guards"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      # scripts/test-lint-dependabot runs scripts/lint-dependabot, which imports
      # yaml. The ubuntu image happens to ship PyYAML today, so omitting this
      # passes by accident and breaks whenever that changes. dependabot-config
      # installs it too, but that is job-local.
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Install PyYAML"
        run: python3 -m pip install pyyaml

      - name: "Test the release-line guards"
        # Fixture tests for scripts/assert-release-ref and
        # scripts/demo-freshness-check — builds throwaway git repos in a temp
        # dir and asserts every exit-code path. No network, no real history.
        run: scripts/test-release-guards

      - name: "Test the HA runtime pin guard"
        run: scripts/test-ha-runtime-pins

      - name: "Test the dependabot config guard"
        run: scripts/test-lint-dependabot

      - name: "Lint the Node baseline"
        # .nvmrc names the Node major; every setup-node step, the devcontainer,
        # js/package.json engines and scripts/conductor-setup must agree with it.
        run: python3 scripts/lint-node-baseline

      - name: "Test the Node baseline guard"
        run: scripts/test-lint-node-baseline

      - name: "Test the bundle freshness guard"
        # Fixture tests for scripts/check-bundle-freshness, the advisory check
        # scripts/test-fast runs. The real gate is the rebuild-and-diff in
        # lint.yml; this keeps the local warning honest so a silently broken
        # guard cannot make test-fast look thorough.
        run: scripts/test-check-bundle-freshness

      - name: "Test the mutation harness"
        # Fixture tests for scripts/mutate, which proves a test is load-bearing
        # by breaking the code it claims to lock. Its own recorded mutations
        # (tests/MUTATIONS.md) are a pre-ship step, not a CI one -- they would
        # re-run the suite once per row. This step only keeps the harness
        # honest, so a broken one cannot report every mutant as killed.
        run: scripts/test-mutate
